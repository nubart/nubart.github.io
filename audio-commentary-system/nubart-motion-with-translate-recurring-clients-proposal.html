<!DOCTYPE html>

<head>

  <style>
    :root {
      --teal: #008C95;
      --teal-light: #A1D6CA;
      --teal-bg: #EAF6F7;
      --stripe: #F7FBFB;

    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #F3F6F6; color: var(--dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    .page {
      max-width: 760px; margin: 0 auto; background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .page-inner { padding: 48px 56px 56px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .topbar img.logo { height: 34px; }
    .topbar .date { font-size: 12px; color: var(--gray); }
    hr.rule { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    .hero-wrap { margin: 0 -56px 24px; }
    .hero-wrap img { width: 100%; display: block; }
    .product-logo { height: 26px; margin-bottom: 18px; display: block; }

    h1.intro-title { font-size: 26px; color: var(--teal); margin: 0 0 18px; font-weight: 700; }
    .prospect-line { font-size: 14px; margin-bottom: 2px; }
    .prospect-line .company { font-weight: 700; }
    .prospect-line .loc { color: var(--gray); }
    .attn-line { font-size: 13px; color: var(--gray); font-style: italic; margin-bottom: 0; }

    h2.section-h { font-size: 17px; color: var(--teal); font-weight: 700; margin: 34px 0 10px; }
    p.section-body { font-size: 14.5px; margin: 0 0 4px; text-align: justify; }

    .stat-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px;
    }
    .stat-tile {
      background: var(--teal-bg); border: 1px solid var(--border); border-radius: 10px;

    .stat-tile .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); margin-bottom: 4px; }
    .stat-tile .stat-value { font-size: 16px; font-weight: 700; color: var(--dark); }

    .price-hero {
      background: linear-gradient(135deg, var(--teal) 0%, #00777e 100%);
      color: #fff; border-radius: 14px; padding: 26px 28px; margin: 16px 0 14px;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .price-hero .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .85; margin-bottom: 6px; }
    .price-hero .amount { font-size: 40px; font-weight: 800; line-height: 1; }
    .price-hero .amount small { font-size: 16px; font-weight: 500; opacity: .85; }
    .price-rows { margin-top: 16px; border-top: 1px solid rgba(255,255,255,.25); padding-top: 12px; }
    .price-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; opacity: .95; }

    /* Option 2 (seasonal tiers) — two amounts side by side inside the same
       price-hero shell, so both options read as one visual family. */
    .season-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 4px; }
    .season-label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .85; margin-bottom: 4px; }
    .season-amount { font-size: 28px; font-weight: 800; line-height: 1.1; }
    .season-amount small { font-size: 14px; font-weight: 500; opacity: .85; }
    .season-hours { font-size: 12.5px; opacity: .9; margin-top: 3px; }

    .savings-callout {
      background: var(--teal-bg); border-left: 4px solid var(--teal); border-radius: 6px;
      padding: 12px 16px; font-size: 15px; font-weight: 700; color: var(--teal); margin-top: 14px;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }

    /* Deliberately narrow and centred rather than full-bleed. Two reasons:
       it is a supporting illustration, not evidence the prospect needs to
       study, so full page width overstated it; and the source image is only
       893px wide, so at the 648px content width it rendered near 1:1 and
       looked soft. At 420px it displays at under half its native size, which
       reads sharp on ordinary and high-DPI screens alike. Centring avoids a
       float, which would have been fragile next to the next-steps <ol> and in

    figure.heatmap { margin: 22px auto 0; max-width: 420px; }
    figure.heatmap img { width: 100%; display: block; border: 1px solid var(--border); border-radius: 10px; }
    figure.heatmap figcaption {
      font-size: 11.5px; color: var(--gray); font-style: italic;
      margin-top: 7px; text-align: center; line-height: 1.45;
    }

    ol.next-steps { margin: 10px 0 0; padding-left: 20px; }
    ol.next-steps li { font-size: 14.5px; margin-bottom: 10px; }

    .rep-card {
      display: flex; align-items: center; gap: 16px; margin-top: 36px;
      padding-top: 24px; border-top: 1px solid var(--border);
    }

    .rep-card .rep-title { font-size: 12.5px; color: var(--gray); font-style: italic; }

    .print-bar {

      border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; justify-content: center;

    .print-btn {
      background: var(--teal); color: #fff; border: none; border-radius: 7px;
      padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .print-btn:hover { background: #006d75; }
    .print-hint { font-size: 11px; color: var(--gray); margin-left: 10px; align-self: center; }

    .state-msg {
      max-width: 480px; margin: 80px auto; text-align: center; color: var(--gray);
      font-size: 14px; padding: 0 20px;
    }
    .state-msg strong { display: block; color: var(--dark); font-size: 16px; margin-bottom: 8px; }

    [hidden] { display: none !important; }

    @media (max-width: 700px) {

      .hero-wrap { margin: 0 -20px 20px; }
      .stat-grid { grid-template-columns: 1fr; }

    @media print {

      h2.section-h { break-after: avoid; }
      .price-hero, .stat-tile, .savings-callout, figure.heatmap { break-inside: avoid; }
      @page { size: A4; margin: 16mm; }
    }
  </style>

<script>
  // Nubart assets. HERO_IMAGE_URL is this page's OWN hero, not shared with any
  // other proposal page — proposal-nubart-motion-with-translate.jpg exists for
  // MOTION + TRANSLATE and nothing else. Keep it that way: the events client
  // page has its own (proposal-nubart-translate.jpg), and briefly sharing one
  // filename between the two meant a swap intended for MOTION silently changed
  // the live events proposal as well. See the v2 note at the top of this file.
  // It replaces bilboats.jpg, which had "BILBOATS.COM" and a phone number
  // legible on the hull — not something to put at the top of a proposal
  // addressed to a different operator. At 900x350 (vs bilboats' 800x550) the
  // hero renders as a slimmer banner; .hero-wrap img is width:100% with auto
  // height, so no CSS change was needed.
  const LOGO_NUBART_URL = 'https://www.nubart.eu/img/customers/logo-nubart-horizontal-teal.png';
  const LOGO_MOTION_URL = 'https://www.nubart.eu/img/customers/logo-nubart-motion-teal.png';
  const HERO_IMAGE_URL  = 'https://www.nubart.eu/img/customers/proposal-nubart-motion-with-translate.jpg';

  // Illustrative coverage heat map, shown under Next steps to make the signal
  // survey described there concrete. Set to '' to drop the figure from every
  // proposal — render() hides it when this is empty, so nothing else needs
  // touching. It is a hosted <img>, NOT part of the link payload, so it costs
  // nothing against the link-length budget.
  const HEATMAP_IMAGE_URL = 'https://www.nubart.eu/img/customers/harbour-hamburg-heatmap.png';

  // ─── Payload decoding ─────────────────────────────────────────────────────
  function base64UrlToBytes(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    const binary = atob(str);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function decodePayload() {
    const raw = location.hash.slice(1);
    if (!raw) throw new Error('No proposal data in link.');
    const sep = raw.indexOf(':');
    const version = sep === -1 ? 'v1' : raw.slice(0, sep);
    const b64 = sep === -1 ? raw : raw.slice(sep + 1);
    const bytes = base64UrlToBytes(b64);

    let jsonBytes = bytes;
    if (version === 'v2') {
      if (!('DecompressionStream' in window)) {
        throw new Error('This link needs a newer browser (gzip decompression unsupported).');
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      jsonBytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    const json = new TextDecoder().decode(jsonBytes);
    return JSON.parse(json);
  }

  // ─── Rendering ────────────────────────────────────────────────────────────
  function txt(id, value) { document.getElementById(id).textContent = value || ''; }

  // Build rows/tiles by creating the elements empty and then assigning
  // textContent, never by interpolating payload values into an HTML string —
  // the payload is attacker-controllable in principle (it's just a URL hash),
  // so nothing from it is ever parsed as HTML.
  function fillPairs(containerId, pairs, rowHtml, labelSel, valueSel) {
    const el = document.getElementById(containerId);
    el.innerHTML = pairs.map(() => rowHtml).join('');
    el.querySelectorAll(labelSel).forEach((node, i) => { node.textContent = pairs[i][0]; });
    el.querySelectorAll(valueSel).forEach((node, i) => { node.textContent = pairs[i][1]; });
  }

  function fillStatTiles(containerId, pairs) {
    fillPairs(containerId, pairs,
      '<div class="stat-tile"><div class="stat-label"></div><div class="stat-value"></div></div>',
      '.stat-label', '.stat-value');
  }

  function fillPriceRows(containerId, pairs) {
    fillPairs(containerId, pairs,
      '<div class="price-row"><span class="pr-label"></span><span class="pr-value"></span></div>',
      '.pr-label', '.pr-value');
  }

  function euro(n) { return '€' + Number(n || 0).toLocaleString(); }

  // "/ month" is the one client-facing string on this page that the payload
  // does not carry a translation for — the generator's AI prompt has no
  // proposalText field for it, and adding one was out of scope. Rather than
  // print an English "/ month" inside a German or Polish proposal, translate
  // it here from the language the payload already states, the same way
  // formatDate() below derives its locale. Covers the eight languages the
  // generator offers (LANGS in nubart-motion-translate-proposal.html);
  // anything else falls back to English.
  // NOTE: nubart-translate-events-clients-proposal.html hardcodes the English
  // "/ month" and has the same issue — deliberately not touched here, since
  // that page is live and outside this task's scope. Worth raising with Rosa.
  function perMonth(lang) {
    return '/ ' + ({
      'Deutsch': 'Monat', 'Français': 'mois', 'Español': 'mes', 'Italiano': 'mese',
      'Nederlands': 'maand', 'Polski': 'miesiąc', 'Português (BR)': 'mês',
    }[lang] || 'month');
  }

  function formatDate(lang) {
    const locale = {
      'Deutsch': 'de-DE', 'Français': 'fr-FR', 'Español': 'es-ES', 'Italiano': 'it-IT',
      'Nederlands': 'nl-NL', 'Polski': 'pl-PL', 'Português (BR)': 'pt-BR',
    }[lang] || 'en-GB';
    return new Date().toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function render(d) {
    const t = d.proposalText || {};
    const p = d.pricing || {};
    const o1 = p.option1;
    const o2 = p.option2;
    const rep = d.rep || {};

    document.title = 'Nubart MOTION + TRANSLATE — Proposal for ' + (d.company || '');

    document.getElementById('nubartLogo').src = LOGO_NUBART_URL;
    document.getElementById('heroImage').src = HERO_IMAGE_URL;
    document.getElementById('productLogo').src = LOGO_MOTION_URL;
    txt('dateLine', formatDate(d.lang));

    txt('introTitle', t.introTitle);
    txt('companyName', d.company);
    txt('locationLine', d.location ? '  ·  ' + d.location : '');
    if (d.contact) {
      document.getElementById('attnLine').hidden = false;
      txt('attnLine', 'Attn: ' + d.contact + (d.email ? '  ·  ' + d.email : ''));
    }

    txt('overviewHeading', t.overviewHeading || 'Overview');
    txt('executiveSummary', t.executiveSummary);
    txt('situationHeading', t.situationHeading || 'Your situation');
    txt('situationAnalysis', t.situationAnalysis);
    txt('solutionHeading', t.solutionHeading || 'The solution: Nubart MOTION + TRANSLATE');
    txt('solutionDescription', t.solutionDescription);

    // ── Usage estimate ──────────────────────────────────────────────────────
    txt('usageHeading', t.usageHeading || 'Usage estimate');
    const usage = [
      [t.lbl_vehicles || 'Vehicles',
        (d.vehicles || '') + ' × ' + (t.val_vehicleType || d.vehicle || '')],
      [t.lbl_tourLength || 'Tour length (billable)',
        (d.effHours || '') + ' h  (' + (d.tourlength || '') + ' h, ' + (t.val_fullguidePct || d.fullguidePct || '') + ')'],
      [t.lbl_toursPerDay || 'Tours per day per vehicle', String(d.toursperday || '')],
      [t.lbl_daysPerWeek || 'Operating days / week', String(d.daysperweek || '')],
      [t.lbl_monthsPerYear || 'Operating months / year', String(d.months || '')],
      [t.lbl_monthlyHours || 'Estimated monthly stream hours',
        Math.round(p.totalMonthlyHours || 0) + ' h'],
      [t.lbl_costPerPax || 'Cost per passenger (approx.)',
        p.costPerPassenger ? '€' + Number(p.costPerPassenger).toFixed(2) : '—'],
    ];
    fillStatTiles('usageStats', usage);

    // ── Pricing ─────────────────────────────────────────────────────────────
    txt('pricingHeading', t.pricingHeading || 'Pricing proposal');
    txt('pricingNote', t.pricingNote);

    if (o1) {
      document.getElementById('option1Block').hidden = false;
      txt('option1Heading', t.option1Heading || 'Option 1 — Flat monthly rate');
      document.getElementById('option1Amount').textContent = euro(o1.monthlyFee);
      document.getElementById('option1Per').textContent = perMonth(d.lang);
      fillPriceRows('option1Rows', [
        [t.lbl_includedHours || 'Included hours / month', (o1.includedHours || 0) + ' h'],
        [t.lbl_effectiveRate || 'Effective rate per hour', '€' + Number(o1.effectiveHourlyRate || 0).toFixed(2)],
        [t.lbl_overage || 'Overage rate (above cap)', euro(o1.overageRate) + ' / h'],
        [t.lbl_annualTotal || 'Annual total', euro(o1.annualFee)],
      ]);
    }

    if (o2) {
      document.getElementById('option2Block').hidden = false;
      txt('option2Heading', t.option2Heading || 'Option 2 — Seasonal tiered rate');

      txt('lowSeasonLabel', (t.lbl_lowSeason || 'Low season')
        + (o2.lowSeasonLabel ? ' · ' + o2.lowSeasonLabel : ''));
      document.getElementById('lowSeasonAmount').textContent = euro(o2.lowSeasonFee);
      document.getElementById('lowSeasonPer').textContent = perMonth(d.lang);
      txt('lowSeasonHours', (o2.lowSeasonHours || 0) + ' h '
        + (t.lbl_includedHours || 'included'));

      txt('highSeasonLabel', (t.lbl_highSeason || 'High season')
        + (o2.highSeasonLabel ? ' · ' + o2.highSeasonLabel : ''));
      document.getElementById('highSeasonAmount').textContent = euro(o2.highSeasonFee);
      document.getElementById('highSeasonPer').textContent = perMonth(d.lang);
      txt('highSeasonHours', (o2.highSeasonHours || 0) + ' h '
        + (t.lbl_includedHours || 'included'));

      fillPriceRows('option2Rows', [
        [t.lbl_overage || 'Overage rate (above cap)', euro(o2.overageRate) + ' / h'],
        [t.lbl_annualTotal || 'Annual total', euro(o2.annualFee)],
      ]);
    }

    // ── ROI ─────────────────────────────────────────────────────────────────
    txt('roiHeading', t.roiHeading || 'Return on investment');
    txt('roiNarrative', t.roiNarrative);
    txt('breakEvenSentence', t.breakEvenSentence
      || (p.extraBookingsToBreakEven == null
        ? ''
        : 'Break-even: ' + p.extraBookingsToBreakEven + ' additional international bookings per month.'));

    txt('nextStepsHeading', t.nextStepsHeading || 'Next steps');
    const steps = Array.isArray(t.nextSteps) ? t.nextSteps : (t.nextSteps ? [t.nextSteps] : []);
    document.getElementById('nextStepsList').innerHTML = steps.map(() => '<li></li>').join('');
    document.querySelectorAll('#nextStepsList li').forEach((li, i) => { li.textContent = steps[i]; });

    // Coverage heat map. Caption comes from the payload so it is translated
    // like every other client-facing string; the English text is only a
    // fallback for when the model omits the field.
    if (HEATMAP_IMAGE_URL) {
      const caption = t.lbl_coverageHeatMap
        || 'Connectivity check on a harbour route: position and signal data gathered remotely from phones on board, accumulated over many tours. Every point shown had a working mobile connection — your own route is measured the same way during the trial.';
      document.getElementById('heatmapFigure').hidden = false;
      document.getElementById('heatmapImage').src = HEATMAP_IMAGE_URL;
      document.getElementById('heatmapImage').alt = caption;
      txt('heatmapCaption', caption);
    }

    if (rep.name || rep.email || rep.phone) {
      document.getElementById('repCard').hidden = false;
      txt('repName', rep.name);
      if (rep.title) { document.getElementById('repTitle').hidden = false; txt('repTitle', rep.title); }
      if (rep.email) { document.getElementById('repEmail').hidden = false; txt('repEmail', '✉  ' + rep.email); }
      if (rep.phone) { document.getElementById('repPhone').hidden = false; txt('repPhone', '✆  ' + rep.phone); }
    }

    document.getElementById('loadingState').hidden = true;
    document.getElementById('content').hidden = false;
    document.getElementById('printBar').hidden = false;
  }

  decodePayload().then(render).catch(err => {
    console.error(err);
    document.getElementById('loadingState').hidden = true;
    document.getElementById('errorState').hidden = false;
  });
</script>
</body>
</html>
